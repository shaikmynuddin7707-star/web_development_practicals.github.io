<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<nav class="navbar"></nav>
<main class="container">

<h1>BMI Calculator</h1><form onsubmit="event.preventDefault();calculate()"><label>Weight (kg)</label><input id="weight" type="number" step="0.1" required><label>Height (cm)</label><input id="height" type="number" step="0.1" required><button class="btn">Calculate BMI</button></form><div id="result" class="result"></div>
<script>function calculate(){let w=+weight.value,h=+height.value/100,b=w/(h*h);let category=b<18.5?'Underweight':b<25?'Normal range':b<30?'Overweight':'Obesity';result.textContent=`BMI: ${b.toFixed(2)} — ${category}`}</script>
</main>
<footer class="footer">HTML-CSS-JS Practical &copy; <span class="year"></span></footer>
<script src="../scripts/common.js"></script>
<script>addNav();</script>
</body>
</html>
