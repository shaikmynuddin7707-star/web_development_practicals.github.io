<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color Generator</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<nav class="navbar"></nav>
<main class="container">

<h1>Color Generator</h1><div id="preview" class="color-preview"></div><h2 id="hex" class="center">#000000</h2><div class="center"><button class="btn" onclick="generate()">Generate Color</button></div>
<script>function generate(){let chars='0123456789ABCDEF',c='#';for(let i=0;i<6;i++)c+=chars[Math.floor(Math.random()*16)];preview.style.background=c;hex.textContent=c}generate()</script>
</main>
<footer class="footer">HTML-CSS-JS Practical &copy; <span class="year"></span></footer>
<script src="../scripts/common.js"></script>
<script>addNav();</script>
</body>
</html>
