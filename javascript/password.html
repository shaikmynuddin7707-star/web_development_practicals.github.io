<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<nav class="navbar"></nav>
<main class="container">

<h1>Password Generator</h1><label>Password Length</label><input id="length" type="number" min="4" max="50" value="12"><button class="btn" onclick="generate()">Generate</button><input id="password" readonly>
<script>function generate(){let chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';let n=Math.min(50,Math.max(4,+length.value||12)),p='';for(let i=0;i<n;i++)p+=chars[Math.floor(Math.random()*chars.length)];password.value=p}</script>
</main>
<footer class="footer">HTML-CSS-JS Practical &copy; <span class="year"></span></footer>
<script src="../scripts/common.js"></script>
<script>addNav();</script>
</body>
</html>
