<h1>Operators</h1><input id="a" type="number" value="10"><input id="b" type="number" value="5"><button class="btn" onclick="calc()">Calculate</button><div id="out" class="result"></div><script>function calc(){let a=+document.getElementById('a').value,b=+document.getElementById('b').value;document.getElementById('out').textContent=`Addition: ${a+b}, Subtraction: ${a-b}, Multiplication: ${a*b}, Division: ${a/b}`}</script>
</main>
