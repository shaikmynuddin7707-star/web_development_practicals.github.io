<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<nav class="navbar"></nav>
<main class="container">

<h1 class="center">Calculator</h1><div class="calc"><input id="display" class="calc-display" readonly><div class="calc-grid">
<button onclick="clearDisplay()">C</button><button onclick="backspace()">⌫</button><button onclick="press('%')">%</button><button onclick="press('/')">÷</button>
<button onclick="press('7')">7</button><button onclick="press('8')">8</button><button onclick="press('9')">9</button><button onclick="press('*')">×</button>
<button onclick="press('4')">4</button><button onclick="press('5')">5</button><button onclick="press('6')">6</button><button onclick="press('-')">−</button>
<button onclick="press('1')">1</button><button onclick="press('2')">2</button><button onclick="press('3')">3</button><button onclick="press('+')">+</button>
<button onclick="press('0')">0</button><button onclick="press('.')">.</button><button onclick="calculate()" style="grid-column:span 2">=</button>
</div></div>
<script>
function press(v){display.value+=v}
function clearDisplay(){display.value=''}
function backspace(){display.value=display.value.slice(0,-1)}
function calculate(){try{if(!/^[0-9+\-*/%.()\s]+$/.test(display.value))throw Error();display.value=Function('return '+display.value)()}catch(e){display.value='Error'}}
</script>
</main>
<footer class="footer">HTML-CSS-JS Practical &copy; <span class="year"></span></footer>
<script src="../scripts/common.js"></script>
<script>addNav();</script>
</body>
</html>
