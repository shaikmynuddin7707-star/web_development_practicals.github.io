<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stopwatch</title>
<link rel="stylesheet" href="../styles/style.css">
</head>
<body>
<nav class="navbar"></nav>
<main class="container">

<h1>Stopwatch</h1><div id="display" class="stopwatch-display">00:00:00</div>
<div class="center flex" style="justify-content:center"><button class="btn success" onclick="start()">Start</button><button class="btn secondary" onclick="pause()">Pause</button><button class="btn danger" onclick="reset()">Reset</button></div>
<script>
let seconds=0,timer=null;
function format(s){let h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');return `${h}:${m}:${x}`}
function render(){document.getElementById('display').textContent=format(seconds)}
function start(){if(!timer)timer=setInterval(()=>{seconds++;render()},1000)}
function pause(){clearInterval(timer);timer=null}
function reset(){pause();seconds=0;render()}
</script>
</main>
<footer class="footer">HTML-CSS-JS Practical &copy; <span class="year"></span></footer>
<script src="../scripts/common.js"></script>
<script>addNav();</script>
</body>
</html>
